name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke-test the CLI and viewer build
        run: |
          python -m elevsim compare --passengers 80 --seeds 2
          python -m elevsim viewer --out dist/viewer.html
